{% extends 'base.html' %}{% block content %}<div class="auth-card"><h1>Welcome, {{ user.full_name.split()[0] }}.</h1><p>Set a password for your instructor account. Your username is {{ user.username }}.</p><form method="POST" class="learning-form"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Password (at least 12 characters)<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" minlength="12" required></label><button class="btn btn-primary">Set password</button></form></div>{% endblock %}
