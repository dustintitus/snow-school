<form method="POST" class="learning-form"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}">{% if req %}<input type="hidden" name="requirement_id" value="{{ req.id }}">{% endif %}<label>Title<input name="title" value="{{ req.title if req else '' }}" maxlength="160" required></label><label>Approved instructions / SOP text<textarea name="content" rows="5" maxlength="12000" required>{{ req.content if req else '' }}</textarea></label><label>Training video or document link (HTTPS)<input type="url" name="resource_url" value="{{ req.resource_url if req else '' }}" maxlength="700"></label><label><input type="checkbox" name="requires_training" {% if req and req.requires_training %}checked{% endif %}> Admin must confirm training before acknowledgment</label><label><input type="checkbox" name="active" {% if not req or req.active %}checked{% endif %}> Required for active instructors</label><button class="btn btn-primary">Save requirement</button></form>
