{% extends 'base.html' %}{% block content %}<h1>{{ student.full_name }} · Participant support</h1><p>Emails remain in administration. Assigned instructors see support notes only when marked below, and phone details only when sharing is enabled.</p><form method="POST" class="card learning-form"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Birthdate for parent lookup<input type="date" name="birthdate" value="{{ details.birthdate if details and details.birthdate else '' }}"></label><label><input type="checkbox" name="special_needs" {% if details and details.special_needs %}checked{% endif %}> Special needs / medical support information for assigned instructor</label><label>Instructor support notes<textarea name="instructor_notes" maxlength="2000">{{ details.instructor_notes if details else '' }}</textarea></label><label>Parent / emergency contact name<input name="contact_name" maxlength="120" value="{{ details.contact_name if details else '' }}"></label><label>Contact phone<input type="tel" name="phone" maxlength="50" value="{{ details.phone if details else '' }}"></label><label><input type="checkbox" name="share_contact" {% if details and details.share_contact %}checked{% endif %}> Share this contact with the assigned instructor while special needs is enabled</label><button class="btn btn-primary">Save participant support</button></form>{% endblock %}
