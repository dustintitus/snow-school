{% extends 'base.html' %}
{% block content %}<div class="auth-container"><div class="auth-card"><p class="eyebrow">Snow School Coach</p><h2>{{ 'Family' if current_user.user_type == 'parent' else 'Athlete' }} access is available on the website</h2><p>This app is for coaches and staff. Your account and records remain available through your school website.</p><button class="btn btn-primary" type="button" onclick="window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify({type:'open-website'}))">Open school website</button><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><button class="btn btn-secondary">Sign out and switch account</button></form></div></div>{% endblock %}
